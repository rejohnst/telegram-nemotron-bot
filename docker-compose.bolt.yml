# Used automatically by compose-model with nemotron-3.5-bolt.env.
# Requires Docker Compose >=2.24.4 for !override. Reuse the nim service name,
# network address and loopback port so existing clients keep their endpoint.
services:
  nim:
    image: telegram-nemotron-bolt:2026-10-23
    build:
      context: ./inference/bolt
      args:
        MODEL_REVISION: ${BOLT_MODEL_REVISION:?Use model-presets/nemotron-3.5-bolt.env}
    environment: !override
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /opt/bolt/cache/huggingface
      VLLM_USE_V2_MODEL_RUNNER: "1"
    volumes: !override
      - bolt-cache:/opt/bolt/cache
    shm_size: 16gb
    command:
      - nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB
      - --revision
      - ${BOLT_MODEL_REVISION:?Use model-presets/nemotron-3.5-bolt.env}
      - --code-revision
      - ${BOLT_MODEL_REVISION:?Use model-presets/nemotron-3.5-bolt.env}
      - --served-model-name
      - ${MODEL_NAME:?Use model-presets/nemotron-3.5-bolt.env}
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --trust-remote-code
      - --load-format
      - auto
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      - ${BOLT_MAX_MODEL_LEN:-131072}
      - --max-num-seqs
      - "1"
      - --gpu-memory-utilization
      - ${BOLT_GPU_MEMORY_UTILIZATION:-0.5}
      - --enable-chunked-prefill
      - --kv-cache-dtype
      - fp8
      - --linear-backend
      - b12x
      - --moe-backend
      - b12x
      - --attention-backend
      - FLASHINFER
      - --mamba-backend
      - flashinfer
      - --mamba-ssm-cache-dtype
      - bfloat16
      - --mamba-cache-dtype
      - bfloat16
      - --mamba-cache-mode
      - align
      - --seed
      - "42"
      - --limit-mm-per-prompt
      - '{"video":1,"image":1}'
      - --video-pruning-rate
      - "0.5"
      - --media-io-kwargs
      - '{"video":{"fps":2,"num_frames":256}}'
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --reasoning-parser-plugin
      - /opt/bolt/ultra_v3_reasoning_parser.py
      - --reasoning-parser
      - ultra_v3
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]

volumes:
  bolt-cache:
